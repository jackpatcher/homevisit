  <script>
// ===== CONFIG =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxxAs5v2-OdAXxeJGEKKvyiRNsxkeE2LYnOo3qo3tmKghySKvT37Gbejr4b00Vs91LY/exec';
const GAS_CODE = `// ===== CONFIG =====
const SHEET_NAME = 'Students';
const TEACHER_PASSWORD = 'teacher123';

// ===== INITIALIZE SHEET =====
function initSheet() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) {
    sheet = ss.insertSheet(SHEET_NAME);
    const headers = [
      'studentId', 'prefix', 'firstName', 'lastName', 'nickname',
      'gender', 'class', 'room', 'phone',
      'parentName', 'parentPhone', 'guardianStatus',
      'province', 'district', 'address',
      'lat', 'lng', 'photoUrl',
      'visited', 'visitDate', 'visitNotes',
      'createdAt', 'updatedAt'
    ];
    sheet.appendRow(headers);
  }
  return sheet;
}

// ===== MAIN HANDLER =====
function doGet(e) {
  return handleRequest(e);
}

function doPost(e) {
  return handleRequest(e);
}

function handleRequest(e) {
  try {
    const action = e.parameter.action || '';
    const callback = e.parameter.callback || 'callback';
    
    let result = {};
    
    if (action === 'submit') {
      result = handleSubmit(e);
    } else if (action === 'getAll') {
      const password = e.parameter.password || '';
      if (password !== TEACHER_PASSWORD) {
        result = { success: false, message: 'รหัสผ่านไม่ถูกต้อง' };
      } else {
        result = handleGetAll();
      }
    } else if (action === 'update') {
      const password = e.parameter.password || '';
      if (password !== TEACHER_PASSWORD) {
        result = { success: false, message: 'รหัสผ่านไม่ถูกต้อง' };
      } else {
        result = handleUpdate(e);
      }
    } else if (action === 'getStats') {
      const password = e.parameter.password || '';
      if (password !== TEACHER_PASSWORD) {
        result = { success: false, message: 'รหัสผ่านไม่ถูกต้อง' };
      } else {
        result = handleGetStats();
      }
    } else {
      result = { success: false, message: 'ไม่รู้จักการดำเนินการ' };
    }
    
    return ContentService.createTextOutput(callback + '(' + JSON.stringify(result) + ')')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  } catch (err) {
    Logger.log('Error: ' + err.toString());
    const callback = e.parameter.callback || 'callback';
    return ContentService.createTextOutput(callback + '(' + JSON.stringify({ success: false, message: err.toString() }) + ')')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
}

// ===== SUBMIT HANDLER =====
function handleSubmit(e) {
  try {
    const sheet = initSheet();
    
    let data = {};
    if (e.parameter.data) {
      data = JSON.parse(e.parameter.data);
    } else {
      data = {
        studentId: e.parameter.studentId || '',
        prefix: e.parameter.prefix || '',
        firstName: e.parameter.firstName || '',
        lastName: e.parameter.lastName || '',
        nickname: e.parameter.nickname || '',
        gender: e.parameter.gender || '',
        class: e.parameter.class || '',
        room: e.parameter.room || '',
        phone: e.parameter.phone || '',
        parentName: e.parameter.parentName || '',
        parentPhone: e.parameter.parentPhone || '',
        guardianStatus: e.parameter.guardianStatus || '',
        province: e.parameter.province || '',
        district: e.parameter.district || '',
        address: e.parameter.address || '',
        lat: e.parameter.lat || '',
        lng: e.parameter.lng || '',
        photoUrl: e.parameter.photoUrl || ''
      };
    }
    
    if (!data.studentId || !data.firstName || !data.lastName) {
      return { success: false, message: 'กรุณากรอกข้อมูลที่จำเป็น' };
    }
    
    const existingRow = findRowByStudentId(sheet, data.studentId);
    
    if (existingRow) {
      updateRow(sheet, existingRow, data);
      return { success: true, message: 'อัปเดตข้อมูลสำเร็จ' };
    } else {
      const row = [
        data.studentId,
        data.prefix,
        data.firstName,
        data.lastName,
        data.nickname,
        data.gender,
        data.class,
        data.room,
        data.phone,
        data.parentName,
        data.parentPhone,
        data.guardianStatus,
        data.province,
        data.district,
        data.address,
        data.lat,
        data.lng,
        data.photoUrl,
        'no',
        '',
        '',
        new Date().toISOString(),
        new Date().toISOString()
      ];
      
      sheet.appendRow(row);
      return { success: true, message: 'บันทึกข้อมูลสำเร็จ' };
    }
  } catch (err) {
    Logger.log('Submit error: ' + err.toString());
    return { success: false, message: 'เกิดข้อผิดพลาด: ' + err.toString() };
  }
}

// ===== GET ALL HANDLER =====
function handleGetAll() {
  try {
    const sheet = initSheet();
    const data = sheet.getDataRange().getValues();
    const headers = data[0];
    const students = [];
    
    for (let i = 1; i < data.length; i++) {
      const row = data[i];
      if (!row[0]) continue;
      
      const student = {};
      headers.forEach((header, idx) => {
        student[header] = row[idx];
      });
      students.push(student);
    }
    
    return { success: true, data: students };
  } catch (err) {
    Logger.log('GetAll error: ' + err.toString());
    return { success: false, message: 'เกิดข้อผิดพลาด: ' + err.toString() };
  }
}

// ===== UPDATE HANDLER =====
function handleUpdate(e) {
  try {
    const sheet = initSheet();
    const studentId = e.parameter.studentId || '';
    const visited = e.parameter.visited || '';
    const visitDate = e.parameter.visitDate || '';
    const visitNotes = e.parameter.visitNotes || '';
    
    if (!studentId) {
      return { success: false, message: 'ต้องระบุ studentId' };
    }
    
    const data = sheet.getDataRange().getValues();
    const headers = data[0];
    
    for (let i = 1; i < data.length; i++) {
      if (data[i][0] === studentId) {
        const visitedIdx = headers.indexOf('visited');
        const visitDateIdx = headers.indexOf('visitDate');
        const visitNotesIdx = headers.indexOf('visitNotes');
        const updatedAtIdx = headers.indexOf('updatedAt');
        
        if (visitedIdx !== -1) sheet.getRange(i + 1, visitedIdx + 1).setValue(visited);
        if (visitDateIdx !== -1) sheet.getRange(i + 1, visitDateIdx + 1).setValue(visitDate);
        if (visitNotesIdx !== -1) sheet.getRange(i + 1, visitNotesIdx + 1).setValue(visitNotes);
        if (updatedAtIdx !== -1) sheet.getRange(i + 1, updatedAtIdx + 1).setValue(new Date().toISOString());
        
        return { success: true, message: 'อัปเดตสำเร็จ' };
      }
    }
    
    return { success: false, message: 'ไม่พบนักเรียน' };
  } catch (err) {
    Logger.log('Update error: ' + err.toString());
    return { success: false, message: 'เกิดข้อผิดพลาด: ' + err.toString() };
  }
}

// ===== STATS HANDLER =====
function handleGetStats() {
  try {
    const sheet = initSheet();
    const data = sheet.getDataRange().getValues();
    const headers = data[0];
    
    const districtIndex = headers.indexOf('district');
    const guardianIndex = headers.indexOf('guardianStatus');
    
    const districtStats = {};
    const guardianStats = {};
    
    for (let i = 1; i < data.length; i++) {
      if (!data[i][0]) continue;
      
      const district = data[i][districtIndex] || 'ไม่ระบุ';
      const guardian = data[i][guardianIndex] || 'other';
      
      districtStats[district] = (districtStats[district] || 0) + 1;
      guardianStats[guardian] = (guardianStats[guardian] || 0) + 1;
    }
    
    return { 
      success: true, 
      districtStats: districtStats,
      guardianStats: guardianStats,
      total: data.length - 1
    };
  } catch (err) {
    Logger.log('Stats error: ' + err.toString());
    return { success: false, message: 'เกิดข้อผิดพลาด: ' + err.toString() };
  }
}

// ===== HELPER FUNCTIONS =====
function findRowByStudentId(sheet, studentId) {
  const data = sheet.getDataRange().getValues();
  for (let i = 1; i < data.length; i++) {
    if (data[i][0] === studentId) {
      return i + 1;
    }
  }
  return null;
}

function updateRow(sheet, rowNum, data) {
  const row = sheet.getRange(rowNum).getValues()[0];
  const headers = sheet.getRange(1, 1, 1, sheet.getLastColumn()).getValues()[0];
  
  headers.forEach((header, idx) => {
    if (data[header] !== undefined) {
      sheet.getRange(rowNum, idx + 1).setValue(data[header]);
    }
  });
  
  const updatedAtIdx = headers.indexOf('updatedAt');
  if (updatedAtIdx !== -1) {
    sheet.getRange(rowNum, updatedAtIdx + 1).setValue(new Date().toISOString());
  }
}`;

function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-500' : 'bg-blue-500'}`;

function initStudentMap() {
  studentMap = L.map('map').setView([13.75, 100.5], 10);

    attribution: '© OpenStreetMap'
  }).addTo(studentMap);

    setStudentLocation(e.latlng.lat, e.latlng.lng);

    document.getElementById('mapInstruction').classList.add('hidden');
  });

function getGPS() {
  if (!navigator.geolocation) { showToast('เบราว์เซอร์ไม่รองรับ GPS', 'error'); return; }
  showToast('กำลังหาตำแหน่ง...', 'info');
  navigator.geolocation.getCurrentPosition(
    pos => setStudentLocation(pos.coords.latitude, pos.coords.longitude),
    () => showToast('ไม่สามารถหาตำแหน่งได้ กรุณาเปิด GPS', 'error'),
    { enableHighAccuracy: true }

function setStudentLocation(lat, lng) {

function renderTeacherMap() {
  if (teacherMapObj) teacherMapObj.remove();
  const container = document.getElementById('teacherMap');
  teacherMapObj = L.map(container).setView([13.75, 100.5], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(teacherMapObj);

  const bounds = [];
  filteredStudents.forEach(s => {
    if (!s.lat || !s.lng) return;
    const lat = parseFloat(s.lat), lng = parseFloat(s.lng);
    if (isNaN(lat) || isNaN(lng)) return;
    bounds.push([lat, lng]);

    const color = s.visited === 'yes' ? '#10b981' : s.gender === 'female' ? '#ec4899' : '#3b82f6';
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:14px;height:14px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>`,
      iconSize: [14, 14], iconAnchor: [7, 7]
    });
    L.marker([lat, lng], { icon }).addTo(teacherMapObj)
      .bindPopup(`<b>${s.prefix}${s.firstName}</b><br>${s.class}/${s.room}<br>📞 ${s.phone}`);
  });
  if (bounds.length) teacherMapObj.fitBounds(bounds, { padding: [30, 30] });
  setTimeout(() => teacherMapObj.invalidateSize(), 200);
}

function renderRoute() {
  const unvisited = filteredStudents.filter(s => s.visited !== 'yes' && s.lat && s.lng);
  if (!unvisited.length) {
    document.getElementById('routeList').innerHTML = '<p class="text-sm text-slate-500">เยี่ยมครบทุกบ้านแล้ว 🎉</p>';
    return;
  }

  const groups = {};
  unvisited.forEach(s => {
    const lat = parseFloat(s.lat);
    const lng = parseFloat(s.lng);
    const key = lat.toFixed(2) + ',' + lng.toFixed(2);
    if (!groups[key]) groups[key] = [];
    groups[key].push(s);
  });

  const sorted = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
  let html = '';
  sorted.forEach((item, idx) => {
    const coord = item[0];
    const students = item[1];
    const count = students.length;
    let studentHtml = '';
    students.forEach(s => {
      studentHtml += '<div class="text-xs text-slate-700">• ' + s.prefix + s.firstName + ' ' + s.lastName + ' (' + s.class + '/' + s.room + ') - 📞 <a href="tel:' + s.parentPhone + '" class="text-blue-600 underline">' + s.parentPhone + '</a></div>';
    });
    html += '<div class="border border-amber-200 bg-amber-50 rounded-xl p-3"><div class="font-semibold text-amber-800 text-sm">📍 กลุ่มที่ ' + (idx + 1) + ' (' + count + ' บ้าน)</div><div class="mt-1 space-y-1">' + studentHtml + '</div></div>';
  });
  document.getElementById('routeList').innerHTML = html;
}

        copyBtn.classList.add('bg-emerald-700');
        lucide.createIcons();
        
        setTimeout(() => {
          copyBtn.innerHTML = originalHTML;
          copyBtn.classList.remove('bg-emerald-700');
          lucide.createIcons();
        }, 2000);
      }).catch(() => {
        showToast('ไม่สามารถคัดลอกได้', 'error');
      });
    });
  }
});

function getJSONP(action, password) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonpCallback_' + Math.random().toString(36).substr(2, 9);
    window[callbackName] = (data) => {
      delete window[callbackName];
      document.body.removeChild(script);
      resolve(data);
    };
    const url = \`\${GAS_URL}?action=\${action}&password=\${encodeURIComponent(password)}&callback=\${callbackName}\`;
    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => reject(new Error('JSONP error'));
    document.body.appendChild(script);
  });
}

function postJSONP(data) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonpCallback_' + Math.random().toString(36).substr(2, 9);
    window[callbackName] = (result) => {
      delete window[callbackName];
      document.body.removeChild(script);
      resolve(result);
    };
    data.callback = callbackName;
    const url = GAS_URL + '?data=' + encodeURIComponent(JSON.stringify(data));
    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => reject(new Error('JSONP error'));
    document.body.appendChild(script);
  });
}
